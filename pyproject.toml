[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Minimal governance kernel for personal multi-agent workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentcp = "agent_control_plane.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

